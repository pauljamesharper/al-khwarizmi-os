---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: al-khwarizmi-os
# description will be included in the image's metadata
description: Aurora-DX with the mango Wayland compositor in place of KDE Plasma, SDDM login and the "desk" themes.

# Aurora-DX (Universal Blue's KDE developer image) is the base: it brings the
# dev stack (Docker/Podman, KVM/libvirt, VS Code, Homebrew, ujust) and the
# daily Universal Blue updates. This recipe swaps its desktop: Plasma out,
# mango + quickshell in, SDDM with the desk theme as the login screen -- the
# same result as the dotfiles' aurora/setup.sh gives a stock Aurora, baked
# into the image instead of layered at runtime.
base-image: ghcr.io/ublue-os/aurora-dx
image-version: stable

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into the image's root
        # includes: the Terra (mangowm, awww) and Proton VPN repo files and
        # their signing keys, the SDDM shadow-entry fix, and the first-run
        # unit + script.

  - type: dnf
    remove:
      packages:
        # --- KDE Plasma: the whole closure, same list as the dotfiles'
        # aurora/setup.sh AURORA_REMOVE (checked with `dnf remove --assumeno`).
        # Kept from Aurora: Dolphin, Ark, KDE Connect (needs kde-cli-tools ->
        # libkworkspace6), polkit-kde (mango starts it), kio/thumbnailers,
        # kwallet, Breeze Qt style + plasma-integration. ---
        - plasma-workspace
        - plasma-workspace-libs
        - plasma-workspace-wallpapers
        - plasma-desktop
        - plasma-desktop-doc
        - kwin
        - kwin-common
        - kwin-libs
        - aurorae
        - plasma-login-manager
        - kcm-plasmalogin
        - kde-settings-plasmalogin
        - kscreenlocker
        - powerdevil
        - kscreen
        - kglobalacceld
        - kactivitymanagerd
        - kwrited
        - knighttime
        - plasma-nm
        - plasma-nm-openconnect
        - plasma-nm-openvpn
        - plasma-nm-vpnc
        - plasma-pa
        - plasma-systemmonitor
        - ksystemstats
        - plasma-systemsettings
        - kinfocenter
        - kmenuedit
        - plasma-welcome
        - plasma-setup
        - plasma-milou
        - plasma-disks
        - plasma-firewall
        - plasma-firewall-firewalld
        - plasma-thunderbolt
        - plasma-vault
        - plasma-keyboard
        - kcm-plasma-keyboard
        - plasma-browser-integration
        - plasma-drkonqi
        - kdeplasma-addons
        - plasma-wallpapers-dynamic
        - plasma-wallpapers-dynamic-builder
        - plasma-wallpapers-dynamic-builder-bash-completion
        - plasma-wallpapers-dynamic-builder-fish-completion
        - plasma-wallpapers-dynamic-builder-zsh-completion
        - plasma-print-manager
        - plasma-print-manager-libs
        - plasma-union
        - plasma-oxygen
        - plasma-oxygen-qt5
        - plasma-oxygen-qt6
        - plasma-lookandfeel-fedora
        - kde-settings-plasma
        - kate
        - kate-krunner-plugin
        - kate-libs
        - kate-plugins
        - kwrite
        - konsole
        - konsole-part
        - spectacle
        - filelight
        - kde-partitionmanager
        - kfind
        - ksystemlog
        - kjournald
        - kjournald-libs
        - kdebugsettings
        - kwalletmanager5
        - krdp
        - krdp-libs
        - kairpods
        - kamera
        - kcm_ublue
        - krunner-bazaar
        - kde-inotify-survey
        - kcm-fcitx5
        - xdg-desktop-portal-kde
        - kde-gtk-config
        - flatpak-kcm
        - colord-kde
        - bluedevil
        - xwaylandvideobridge
    install:
      packages:
        # --- login screen (the greeter runs under weston) ---
        - sddm
        - sddm-wayland-generic

        # --- mango session (mangowm and awww come from Terra) ---
        - mangowm
        - awww # wallpaper daemon
        - quickshell # the bar and every popup
        - dunst # notifications
        - grim # screenshots
        - slurp
        - swayidle # lock after 10 min idle, screens off after 15
        - swaylock
        - wlopm
        - wlr-randr # list outputs for monitorrule
        - wlsunset # night light
        - brightnessctl
        - pamixer # volume keys
        - cliphist # clipboard history
        - xdg-desktop-portal-wlr # screen sharing under mango
        - nm-connection-editor

        # --- apps and theming ---
        - alacritty # terminal (Super+Return)
        - rofi # launcher/menus (Fedora's build has Wayland)
        - imv # image viewer
        - emacs-pgtk # pure-GTK Wayland Emacs, run as a daemon
        - yaru-icon-theme # Yaru-wartybrown, inherited by the Giants icon theme
        - proton-vpn-gnome-desktop # Proton VPN (repo shipped via files above)

  # Vendors a copy of the dotfiles repo (branch mangowm) into the image, then
  # installs the desk SDDM theme from it. Per-user setup runs at first login
  # -- see al-khwarizmi-first-run.service / usr/bin/al-khwarizmi-first-run.
  - type: script
    scripts:
      - vendor-dotfiles.sh
      - desk-greeter.sh

  - type: systemd
    system:
      enabled:
        - sddm.service # becomes display-manager.service
    user:
      enabled:
        - al-khwarizmi-first-run.service
        - ssh-agent.socket # mango's config points SSH_AUTH_SOCK here

  # GUI apps from Flathub on top of Aurora's defaults -- sandboxed and
  # updated independently of the OS.
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.discordapp.Discord # Super+D
          - com.obsproject.Studio # Super+O
          - org.gimp.GIMP # Super+G
          - com.slack.Slack
          - com.spotify.Client
          - org.keepassxc.KeePassXC
          - org.telegram.desktop
          - org.pulseaudio.pavucontrol # the bar's volume mixer

  - type: signing # sets up the policy & signing files for signed images
