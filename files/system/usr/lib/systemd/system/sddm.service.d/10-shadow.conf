# Users created by package scriptlets at image build can lack an /etc/shadow
# entry on Fedora Atomic, which breaks PAM for the greeter (Kinoite ships the
# same workaround for its own login manager).
[Service]
ExecStartPre=/bin/sh -c 'grep -q "^sddm:" /etc/shadow || echo "sddm:!*:::::::" >> /etc/shadow; grep -q "^sddm:" /etc/gshadow || echo "sddm:!*::" >> /etc/gshadow'
